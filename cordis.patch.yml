# Optional hardening:
#   allowedRoots       absolute directories an archive path may live in. With no
#                      config any readable path is accepted.
#   allowAnyOutputDir  lets attachment extraction write outside the calling session's
#                      workspace. Off by default: writes stay inside the workspace.
- insert:
